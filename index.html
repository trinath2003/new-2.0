<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartSkill Opportunity</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#14162b;--mute:#62667f;--line:#e3e5f1;--brand:#4338ca;--brand2:#7c3aed;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1020;--card:#191b33;--ink:#eceefb;--mute:#9aa0c3;--line:#2b2e52;--brand:#818cf8;--brand2:#a78bfa;--okbg:#14532d;--ok:#86efac;--badbg:#7f1d1d;--bad:#fecaca;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1020;--card:#191b33;--ink:#eceefb;--mute:#9aa0c3;--line:#2b2e52;--brand:#818cf8;--brand2:#a78bfa;--okbg:#14532d;--ok:#86efac;--badbg:#7f1d1d;--bad:#fecaca;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .2s}
.btn:hover{filter:brightness(1.1)}
.btn.o{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
input,select{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--brand);margin-right:auto}.logo b{color:var(--ink)}
.who{color:var(--mute);font-size:13px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(430px,100%)}
.box h2{margin:0 0 4px}.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.f{display:grid;gap:10px;margin-bottom:14px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:22px 12px;cursor:pointer;text-align:center;font-weight:700}
.role span{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:4px}
.role:hover{border-color:var(--brand)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;max-width:1250px;margin:20px auto;padding:0 16px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start;display:grid;gap:14px}
aside h4{margin:0 0 6px;font-size:14px}
.opt{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}.opt input{width:auto}
.range{display:flex;gap:8px;align-items:center}
.list{display:grid;gap:12px}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:14px;cursor:pointer;justify-content:space-between;transition:border-color .15s}
.job:hover{border-color:var(--brand)}
.job h3{margin:0}.meta{color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--okbg);color:var(--ok);display:inline-flex;align-items:center;gap:4px}
.chip.m{background:var(--badbg);color:var(--bad)}
.chip button{background:none;border:none;cursor:pointer;font-size:12px;padding:0;line-height:1;color:inherit;opacity:0.7}
.chip button:hover{opacity:1}
.pct{text-align:center;min-width:76px}.pct b{font-size:24px;display:block;line-height:1.1}.pct small{color:var(--mute)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--line);margin-left:6px;vertical-align:middle}
.applied{color:var(--ok);font-weight:700;font-size:12px;margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(10,10,30,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.slide{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--card);z-index:21;transform:translateX(105%);transition:transform .25s;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow:auto;border-left:1px solid var(--line)}
.slide.on{transform:none}
.x{float:right;background:none;border:0;font-size:26px;cursor:pointer;line-height:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(400px,92%)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:11px 20px;border-radius:12px;z-index:40;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.add-skill-row{display:flex;gap:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
/* --- Departments & Data Config --- */
var DEPT_INFO={
  "Software Development":{cat:"tech",roles:["Frontend Developer","Backend Developer","Full Stack Developer","Mobile App Developer","Java Developer","Python Developer","Node.js Developer","React Developer"],sk:["html","css","javascript","react","node.js","express","mysql","git","rest api","java","python","typescript","mongodb","docker"]},
  "Data & AI":{cat:"tech",roles:["Data Analyst","Data Scientist","Machine Learning Engineer","AI Engineer","BI Developer","Data Engineer"],sk:["python","sql","numpy","pandas","machine learning","statistics","tableau","power bi","deep learning","git","excel","spark"]},
  "Testing & QA":{cat:"tech",roles:["QA Engineer","Automation Tester","Test Analyst","SDET","Performance Tester"],sk:["manual testing","selenium","jira","test cases","api testing","postman","java","git","sql","cypress"]},
  "DevOps & Cloud":{cat:"tech",roles:["DevOps Engineer","Cloud Engineer","Site Reliability Engineer","Systems Administrator","Cloud Architect"],sk:["aws","docker","kubernetes","linux","git","jenkins","terraform","ci/cd","python","networking","azure"]},
  "Cyber Security":{cat:"tech",roles:["Security Analyst","Penetration Tester","SOC Analyst","Security Engineer"],sk:["networking","linux","siem","ethical hacking","firewalls","python","risk analysis","cryptography","incident response"]},
  "UI/UX Design":{cat:"tech",roles:["UI Designer","UX Designer","Product Designer","Visual Designer"],sk:["figma","wireframing","prototyping","user research","html","css","adobe xd","design systems","communication"]},
  "Human Resources":{cat:"non",roles:["HR Executive","Recruiter","Talent Acquisition Specialist","HR Business Partner","Payroll Executive"],sk:["communication","recruitment","excel","interviewing","onboarding","payroll","employee engagement","labour law"]},
  "Sales":{cat:"non",roles:["Sales Executive","Business Development Executive","Account Manager","Inside Sales Representative","Sales Manager"],sk:["negotiation","crm","communication","lead generation","cold calling","presentation","leadership","excel"]},
  "Marketing":{cat:"non",roles:["Digital Marketing Executive","SEO Specialist","Social Media Manager","Brand Manager","Performance Marketer"],sk:["seo","google ads","social media","content strategy","analytics","communication","email marketing","excel"]},
  "Finance & Accounts":{cat:"non",roles:["Accountant","Financial Analyst","Auditor","Accounts Executive","Tax Consultant"],sk:["accounting","tally","excel","budgeting","gst","compliance","financial reporting","auditing"]},
  "Operations":{cat:"non",roles:["Operations Executive","Supply Chain Coordinator","Logistics Manager","Project Coordinator","Process Analyst"],sk:["planning","excel","vendor management","communication","inventory","leadership","reporting","problem solving"]},
  "Customer Support":{cat:"non",roles:["Customer Support Executive","Technical Support Associate","Customer Success Manager","Call Center Agent"],sk:["communication","crm","problem solving","typing","empathy","ticketing","english","excel"]},
  "Content & Writing":{cat:"non",roles:["Content Writer","Copywriter","Technical Writer","Editor","Video Script Writer"],sk:["writing","seo","research","editing","communication","storytelling","wordpress","grammar"]},
  "Legal":{cat:"non",roles:["Legal Associate","Compliance Officer","Contract Manager","Corporate Lawyer"],sk:["legal research","contract drafting","compliance","communication","negotiation","corporate law","documentation"]}
};
var DEPARTMENTS=Object.keys(DEPT_INFO);
var CITIES=["Bengaluru","Hyderabad","Pune","Mumbai","Delhi","Chennai","Kolkata","Ahmedabad","Noida","Gurugram","Remote"];

/* --- Procedural Generator for 200 Robust Jobs --- */
var jobs=(function(){
  var seed=4260;
  function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
  function pick(a){return a[Math.floor(rnd()*a.length)]}
  function sample(a,n){var c=a.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return o}
  var pre=["Tech","Pixel","Cloud","Data","Blue","Nova","Bright","Quantum","Swift","Green","Urban","Apex","Zen","Orbit","Maple","Vertex"];
  var suf=["Works","Labs","Soft","Systems","Hub","Logic","Bridge","Minds","Solutions","Networks"];
  var out=[];
  for(var i=1;i<=200;i++){
    var dept=pick(DEPARTMENTS),info=DEPT_INFO[dept],role=pick(info.roles);
    var min,max;
    if(rnd()<0.25){min=0;max=pick([0,0,1,2])}
    else{min=1+Math.floor(Math.pow(rnd(),1.6)*15);max=Math.min(25,min+2+Math.floor(rnd()*4))}
    var type="Full-time",r=rnd();
    if(min===0&&r<0.4){type="Internship";max=0}
    else if(r>0.92)type="Contract";else if(r>0.85)type="Part-time";
    var title=role;
    if(type==="Internship")title=role+" Intern";
    else if(!/Manager|Architect|Officer|Lawyer/.test(role)){if(min>=8)title="Lead "+role;else if(min>=4)title="Senior "+role}
    var base=(type==="Internship"?1:2.2+min*1.5)*(info.cat==="tech"?1.2:1)*(0.85+rnd()*0.3);
    var lo=Math.round(base*10)/10,hi=Math.round(lo*(type==="Internship"?2:1.4+rnd()*0.5)*10)/10;
    var sk=sample(info.sk,3+Math.floor(rnd()*3)),co=pick(pre)+pick(suf),days=Math.floor(rnd()*15);
    out.push({id:i,t:title,c:co,l:pick(CITIES),type:type,min:min,max:max,
      pay:"₹"+lo.toFixed(1)+" – "+hi.toFixed(1)+" LPA",cat:info.cat,dept:dept,sk:sk,
      mode:pick(["On-site","Hybrid","Remote"]),open:1+Math.floor(rnd()*5),
      posted:days===0?"Today":days===1?"1 day ago":days+" days ago",
      d:"Work on "+sk.slice(0,2).join(" and ")+" as a "+title+" in the "+dept+" division at "+co+". You will collaborate with cross-functional teams, own core deliverables, and drive impactful product milestones.",n:0});
  }
  return out;
})();

var S={view:"auth",tab:"in",user:"",role:"",skills:["html","css","javascript","git","node.js","react","communication","excel","python"],applied:{},sel:null,
f:{lvl:"all",from:1,to:25,cat:"all",dept:"all",city:"all",q:""}};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(v){S.view=v;S.sel=null;render()}

function login(){
  var n=$("nm")?$("nm").value.trim():"";var e=$("em").value.trim();
  S.user=n||(e?e.split("@")[0]:"Demo User");
  go("role");
}
function pickRole(r){S.role=r;go(r==="seeker"?"seeker":"recruiter")}
function logout(){S.user="";S.role="";S.applied={};go("auth")}
function switchRole(){go("role")}

function addSkill(skName){
  var s=skName.trim().toLowerCase();
  if(s&&S.skills.indexOf(s)===-1){S.skills.push(s);render()}
}
function removeSkill(skName){
  S.skills=S.skills.filter(function(s){return s!==skName});
  render();
}

function match(j){
  var have=j.sk.filter(function(s){return S.skills.indexOf(s)>-1}).length;
  return {p:Math.round(have/j.sk.length*100),have:have}
}
function filtered(){
  var f=S.f,q=f.q.toLowerCase();
  return jobs.filter(function(j){
    if(f.cat!=="all"&&j.cat!==f.cat)return false;
    if(f.dept!=="all"&&j.dept!==f.dept)return false;
    if(f.city!=="all"&&j.l!==f.city)return false;
    if(f.lvl==="fresher"&&j.min>0)return false;
    if(f.lvl==="exp"&&(j.max<f.from||j.min>f.to||j.max<1))return false;
    if(q&&(j.t+" "+j.c+" "+j.dept+" "+j.sk.join(" ")).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return match(b).p-match(a).p});
}
function setF(k,v){S.f[k]=v;render()}

function nav(){
  return '<nav><div class="logo">Smart<b>Skill</b> Opportunity</div><span class="who">'+esc(S.user)+' · '+(S.role==="seeker"?"Job Seeker":"Recruiter")+'</span>'
  +'<button class="btn o" onclick="switchRole()">Switch role</button><button class="btn" onclick="logout()">Logout</button></nav>';
}

function render(){
  var a=$("app"),h="";
  if(S.view==="auth"){
    h='<div class="center"><div class="box"><div class="logo" style="margin-bottom:14px">Smart<b>Skill</b> Opportunity</div>'
    +'<h2>'+(S.tab==="in"?"Welcome back":"Create your account")+'</h2><p class="sub">Get hired for what you can do, not just what you wrote.</p>'
    +'<div class="tabs"><button class="'+(S.tab==="in"?"on":"")+'" onclick="S.tab=\'in\';render()">Log in</button><button class="'+(S.tab==="up"?"on":"")+'" onclick="S.tab=\'up\';render()">Sign up</button></div>'
    +'<div class="f">'+(S.tab==="up"?'<input id="nm" placeholder="Full name" aria-label="Full name">':'')
    +'<input id="em" placeholder="Email (anything works)" aria-label="Email"><input id="pw" type="password" placeholder="Password (anything works)" aria-label="Password"></div>'
    +'<button class="btn" style="width:100%" onclick="login()">'+(S.tab==="in"?"Log in":"Sign up")+'</button>'
    +'<p class="note">Demo mode: instant login with any credentials.</p></div></div>';
  }else if(S.view==="role"){
    h='<div class="center"><div class="box"><h2>Hi '+esc(S.user)+', who are you?</h2><p class="sub">Choose how you want to use SmartSkill.</p>'
    +'<div class="roles"><button class="role" onclick="pickRole(\'seeker\')">Job Seeker<span>Browse 200+ curated listings</span></button>'
    +'<button class="role" onclick="pickRole(\'recruiter\')">Recruiter<span>Post jobs & review applicants</span></button></div></div></div>';
  }else if(S.view==="seeker"){
    var L=filtered();
    h=nav()+'<div class="layout"><aside>'
    +'<div><h4>Search</h4><input id="q" value="'+esc(S.f.q)+'" placeholder="Title, company, skill" oninput="S.f.q=this.value;list()"></div>'
    +'<div><h4>Department</h4><select onchange="setF(\'dept\',this.value)"><option value="all">All Departments</option>'+DEPARTMENTS.map(function(d){return '<option value="'+d+'" '+(S.f.dept===d?'selected':'')+'>'+d+'</option>'}).join("")+'</select></div>'
    +'<div><h4>City / Location</h4><select onchange="setF(\'city\',this.value)"><option value="all">All Locations</option>'+CITIES.map(function(c){return '<option value="'+c+'" '+(S.f.city===c?'selected':'')+'>'+c+'</option>'}).join("")+'</select></div>'
    +'<div><h4>Experience level</h4>'
    +[["all","All Levels"],["fresher","Fresher (0 yrs)"],["exp","Experienced"]].map(function(o){return '<label class="opt"><input type="radio" name="lvl" '+(S.f.lvl===o[0]?"checked":"")+' onchange="setF(\'lvl\',\''+o[0]+'\')">'+o[1]+'</label>'}).join("")
    +(S.f.lvl==="exp"?'<div class="range" style="margin-top:8px"><input type="number" min="1" max="25" value="'+S.f.from+'" aria-label="From" onchange="S.f.from=Math.max(1,Math.min(25,+this.value||1));render()"> to <input type="number" min="1" max="25" value="'+S.f.to+'" aria-label="To" onchange="S.f.to=Math.max(1,Math.min(25,+this.value||25));render()"></div>':'')
    +'</div><div><h4>Job type</h4>'
    +[["all","All Categories"],["tech","Technical"],["non","Non-technical"]].map(function(o){return '<label class="opt"><input type="radio" name="cat" '+(S.f.cat===o[0]?"checked":"")+' onchange="setF(\'cat\',\''+o[0]+'\')">'+o[1]+'</label>'}).join("")
    +'</div><div><h4>My Skills Profile</h4>'
    +'<div class="chips" style="margin-bottom:8px">'+S.skills.map(function(s){return '<span class="chip">'+esc(s)+'<button onclick="removeSkill(\''+s+'\')" title="Remove">×</button></span>'}).join("")+'</div>'
    +'<div class="add-skill-row"><input id="newSk" placeholder="Add skill (e.g., react)" onkeydown="if(event.key===\'Enter\'){addSkill(this.value);this.value=\'\'}">'
    +'<button class="btn" style="padding:0 12px" onclick="var el=$(\'newSk\');addSkill(el.value);el.value=\'\'">+</button></div>'
    +'<div class="note">Matches & percentages update instantly.</div></div></aside>'
    +'<main><div id="jl" class="list"></div></main></div>';
  }else{
    h=nav()+'<div class="layout" style="grid-template-columns:1fr;max-width:760px"><div class="box" style="width:100%"><h2>Post a Job Listing</h2><p class="sub">Appears instantly for job seekers across the portal.</p>'
    +'<div class="f"><input id="pt" placeholder="Job title (e.g. Frontend Engineer)"><div class="row"><input id="pc" placeholder="Company Name"><input id="pl" placeholder="City / Remote"></div>'
    +'<div class="row"><input id="pmin" type="number" min="0" max="25" placeholder="Min Years"><input id="pmax" type="number" min="0" max="25" placeholder="Max Years"></div>'
    +'<select id="pcat"><option value="tech">Technical</option><option value="non">Non-technical</option></select>'
    +'<input id="psk" placeholder="Required skills, comma separated (e.g. react, node.js, git)"><input id="pd" placeholder="Short description of role"></div>'
    +'<button class="btn" onclick="post()">Publish Job</button></div>'
    +'<h3 style="margin:22px 0 10px">Your Active Postings & Applicants</h3><div class="list">'
    +jobs.filter(function(j){return j.mine}).map(function(j){return '<div class="job" style="cursor:default"><div><h3>'+esc(j.t)+'</h3><div class="meta">'+esc(j.c)+' · '+esc(j.l)+'</div></div><div class="pct"><b>'+j.n+'</b><small>applicants</small></div></div>'}).join("")
    +(jobs.some(function(j){return j.mine})?"":'<div class="empty">You have not posted any jobs yet.</div>')+'</div></div>';
  }
  a.innerHTML=h;
  if(S.view==="seeker")list();
  panel();
}

function list(){
  var L=filtered(),el=$("jl");if(!el)return;
  el.innerHTML=L.length?L.map(function(j){
    var m=match(j),col=m.p>=60?"var(--ok)":m.p>0?"var(--mute)":"var(--bad)";
    return '<div class="job" tabindex="0" onclick="openJob('+j.id+')" onkeydown="if(event.key===\'Enter\')openJob('+j.id+')"><div><h3>'+esc(j.t)+'<span class="tag">'+(j.cat==="tech"?"Technical":"Non-tech")+'</span></h3>'
    +'<div class="meta">'+esc(j.c)+' · '+esc(j.l)+' · '+j.type+' · '+(j.max===0?"Fresher":j.min+"–"+j.max+" yrs")+' · '+j.pay+'</div>'
    +'<div class="chips">'+j.sk.map(function(s){return '<span class="chip'+(S.skills.indexOf(s)>-1?"":" m")+'">'+esc(s)+'</span>'}).join("")+'</div></div>'
    +'<div class="pct"><b style="color:'+col+'">'+m.p+'%</b><small>match</small>'+(S.applied[j.id]?'<div class="applied">Applied</div>':'')+'</div></div>';
  }).join(""):'<div class="empty">No jobs match your current filters or skills. Try broadening your criteria.</div>';
}

function openJob(id){S.sel=id;panel()}
function closeJob(){S.sel=null;panel()}
function panel(){
  var j=jobs.filter(function(x){return x.id===S.sel})[0],L=$("layer");
  if(!j){L.innerHTML='<div class="ov"></div><div class="slide"></div>';return}
  var m=match(j),miss=j.sk.filter(function(s){return S.skills.indexOf(s)<0});
  L.innerHTML='<div class="ov on" onclick="closeJob()"></div><div class="slide on" role="dialog" aria-label="Job details"><button class="x" onclick="closeJob()" aria-label="Close">×</button>'
  +'<h2 style="margin:0">'+esc(j.t)+'</h2><div class="meta">'+esc(j.c)+' · '+esc(j.l)+' ('+j.mode+') · Posted '+j.posted+'</div>'
  +'<div class="row" style="margin:16px 0"><div><b>Type</b><div class="meta">'+j.type+'</div></div><div><b>Experience</b><div class="meta">'+(j.max===0?"Fresher":j.min+"–"+j.max+" years")+'</div></div><div><b>Salary</b><div class="meta">'+j.pay+'</div></div></div>'
  +'<h4 style="margin:0 0 4px">About the role</h4><p style="margin-top:0">'+esc(j.d)+'</p>'
  +'<h4 style="margin:0 0 4px">Skill Match: '+m.p+'%</h4><div class="chips" style="margin-top:4px">'+j.sk.map(function(s){return '<span class="chip'+(S.skills.indexOf(s)>-1?"":" m")+'">'+esc(s)+'</span>'}).join("")+'</div>'
  +'<p class="note">'+(miss.length?"Missing skills: "+esc(miss.join(", ")):"You have all required skills for this role!")+'</p>'
  +(S.applied[j.id]?'<p class="applied">Applied with '+esc(S.applied[j.id])+'</p>':'<button class="btn" style="width:100%;margin-top:14px" onclick="askResume()">Apply Now</button>')
  +'</div>';
}

function askResume(){
  var d=document.createElement("div");d.id="rm";
  d.innerHTML='<div class="ov on" style="z-index:29"></div><div class="box modal"><h3 style="margin:0 0 4px">Upload your resume</h3><p class="sub">PDF or Word document.</p>'
  +'<input id="rf" type="file" accept=".pdf,.doc,.docx" onchange="$(\'rok\').disabled=!this.files.length">'
  +'<div class="row" style="margin-top:16px"><button class="btn o" onclick="$(\'rm\').remove()">Cancel</button><button id="rok" class="btn" disabled onclick="submitApp()">Submit Application</button></div></div>';
  document.body.appendChild(d);
}
function submitApp(){
  var f=$("rf").files[0];if(!f)return;
  var j=jobs.filter(function(x){return x.id===S.sel})[0];
  S.applied[j.id]=f.name;j.n++;
  $("rm").remove();S.sel=null;panel();list();
  var t=document.createElement("div");t.className="toast";t.textContent="Successfully applied to "+j.t;document.body.appendChild(t);
  setTimeout(function(){t.remove()},2600);
}
function post(){
  var t=$("pt").value.trim();if(!t){$("pt").focus();return}
  jobs.unshift({id:Date.now(),t:t,c:$("pc").value||"Your Company",l:$("pl").value||"Remote",type:"Full-time",min:+$("pmin").value||0,max:+$("pmax").value||0,pay:"Not disclosed",cat:$("pcat").value,dept:"Software Development",
    sk:$("psk").value.toLowerCase().split(",").map(function(s){return s.trim()}).filter(Boolean),d:$("pd").value||"No description provided.",n:0,mine:true});
  render();
}
render();
</script>
</body>
</html>
